[project]
name = "arastirma-hatti"
version = "1.0.0"
description = "AI Agent 101 lab — araştırma asistanı hattı (orkestratör + paralel araştırma ajanları + derleme)"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arastirma"]
